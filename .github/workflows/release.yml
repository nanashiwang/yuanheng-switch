name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version, types and tests
        run: |
          pnpm check:release-version
          pnpm typecheck
          pnpm test:unit

  build:
    needs: validate
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # tauri-action 会增量合并同一份 latest.json，串行可避免多个平台互相覆盖。
      max-parallel: 1
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      YUANHENG_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup pnpm
        if: matrix.platform != 'macos-15-intel'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup pnpm on Intel macOS
        if: matrix.platform == 'macos-15-intel'
        run: npm install --global pnpm@10.12.3

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secrets
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            DRAFT=false
            PRERELEASE=false
          else
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            DRAFT=true
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "Apple signing secrets are not configured; building without Developer ID signing."
            exit 0
          fi

          test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY"

          write_env() {
            local key="$1"
            local value="$2"
            local delimiter="__YUANHENG_${key}__"
            {
              echo "$key<<$delimiter"
              printf '%s\n' "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }

          write_env APPLE_CERTIFICATE "$CERTIFICATE"
          write_env APPLE_CERTIFICATE_PASSWORD "$CERTIFICATE_PASSWORD"
          write_env APPLE_SIGNING_IDENTITY "$SIGNING_IDENTITY"

          if [[ -n "$NOTARIZATION_APPLE_ID" || -n "$NOTARIZATION_PASSWORD" || -n "$NOTARIZATION_TEAM_ID" ]]; then
            test -n "$NOTARIZATION_APPLE_ID"
            test -n "$NOTARIZATION_PASSWORD"
            test -n "$NOTARIZATION_TEAM_ID"
            write_env APPLE_ID "$NOTARIZATION_APPLE_ID"
            write_env APPLE_PASSWORD "$NOTARIZATION_PASSWORD"
            write_env APPLE_TEAM_ID "$NOTARIZATION_TEAM_ID"
          fi

      - name: Build and publish signed updater artifacts
        uses: tauri-apps/tauri-action@v1
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: YuanHeng Desktop ${{ steps.release.outputs.tag }}
          releaseBody: |
            YuanHeng Desktop ${{ steps.release.outputs.tag }}

            安装后可在应用内直接检查、下载并安装后续更新。
          releaseDraft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generateReleaseNotes: true
          updaterJsonPreferNsis: false
          args: --target ${{ matrix.target }}
