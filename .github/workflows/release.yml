name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"
          }

      - name: Prepare Tauri signing key
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "yuanheng-switch.key"
          [System.IO.File]::WriteAllText(
            $keyPath,
            $env:TAURI_SIGNING_PRIVATE_KEY,
            [System.Text.UTF8Encoding]::new($false)
          )
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" >> $env:GITHUB_ENV

      - name: Validate
        run: |
          pnpm typecheck
          pnpm test:unit

      - name: Build Windows app
        run: pnpm tauri build --bundles msi

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $label = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF_NAME
          } else {
            "v$version-build.$env:GITHUB_RUN_NUMBER"
          }

          New-Item -ItemType Directory -Force release-assets | Out-Null

          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Recurse -Filter *.msi |
            Select-Object -First 1
          if ($null -eq $msi) {
            throw "Windows MSI was not generated"
          }

          $msiName = "YuanHeng-Switch-$label-Windows.msi"
          Copy-Item $msi.FullName "release-assets/$msiName"
          if (Test-Path "$($msi.FullName).sig") {
            Copy-Item "$($msi.FullName).sig" "release-assets/$msiName.sig"
          } else {
            throw "Updater signature was not generated for the MSI"
          }

          $exe = "src-tauri/target/release/yuanheng-switch.exe"
          if (-not (Test-Path $exe)) {
            throw "Windows executable was not generated"
          }

          $portableDir = "release-assets/YuanHeng-Switch-Portable"
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Copy-Item $exe "$portableDir/YuanHeng-Switch.exe"
          @("# YuanHeng Switch portable build", "portable=true") |
            Set-Content "$portableDir/portable.ini" -Encoding UTF8
          Compress-Archive "$portableDir/*" "release-assets/YuanHeng-Switch-$label-Windows-Portable.zip"
          Remove-Item $portableDir -Recurse -Force

          "label=$label" >> $env:GITHUB_OUTPUT
          "msi_name=$msiName" >> $env:GITHUB_OUTPUT

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.assets.outputs.msi_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $signature = (Get-Content "release-assets/$env:MSI_NAME.sig" -Raw).Trim()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$env:MSI_NAME"
          $manifest = @{
            version = $version
            notes = "YuanHeng Switch $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "release-assets/latest.json"),
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.assets.outputs.label }}
          target_commitish: ${{ github.sha }}
          name: YuanHeng Switch ${{ steps.assets.outputs.label }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
