name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version, types and tests
        run: |
          pnpm check:release-version
          pnpm typecheck
          pnpm test:unit

  build:
    needs: validate
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # tauri-action 会增量合并同一份 latest.json，串行可避免多个平台互相覆盖。
      max-parallel: 1
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      YUANHENG_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup pnpm
        if: matrix.platform != 'macos-15-intel'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup pnpm on Intel macOS
        if: matrix.platform == 'macos-15-intel'
        run: npm install --global pnpm@10.12.3

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secrets
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            DRAFT=false
            PRERELEASE=false
          else
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            DRAFT=true
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "Apple signing secrets are not configured; building without Developer ID signing."
            exit 0
          fi

          test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY"

          write_env() {
            local key="$1"
            local value="$2"
            local delimiter="__YUANHENG_${key}__"
            {
              echo "$key<<$delimiter"
              printf '%s\n' "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }

          write_env APPLE_CERTIFICATE "$CERTIFICATE"
          write_env APPLE_CERTIFICATE_PASSWORD "$CERTIFICATE_PASSWORD"
          write_env APPLE_SIGNING_IDENTITY "$SIGNING_IDENTITY"

          if [[ -n "$NOTARIZATION_APPLE_ID" || -n "$NOTARIZATION_PASSWORD" || -n "$NOTARIZATION_TEAM_ID" ]]; then
            test -n "$NOTARIZATION_APPLE_ID"
            test -n "$NOTARIZATION_PASSWORD"
            test -n "$NOTARIZATION_TEAM_ID"
            write_env APPLE_ID "$NOTARIZATION_APPLE_ID"
            write_env APPLE_PASSWORD "$NOTARIZATION_PASSWORD"
            write_env APPLE_TEAM_ID "$NOTARIZATION_TEAM_ID"
          fi

      - name: Build and publish signed updater artifacts
        uses: tauri-apps/tauri-action@v1
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: YuanHeng Desktop ${{ steps.release.outputs.tag }}
          releaseBody: |
            YuanHeng Desktop ${{ steps.release.outputs.tag }}

            安装后可在应用内直接检查、下载并安装后续更新。
          releaseDraft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  finalize-updater-manifest:
    name: Publish updater manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Replace rate-limited API asset URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir release-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > release-assets/release.json

          jq --slurpfile release release-assets/release.json '
            ($release[0].assets
              | map({ key: .url, value: .browser_download_url })
              | from_entries) as $asset_urls
            | .platforms |= with_entries(
                .value.url = ($asset_urls[.value.url] // .value.url)
              )
          ' release-assets/latest.json > release-assets/latest.rewritten.json

          test "$(jq -r '.version' release-assets/latest.rewritten.json)" = "${GITHUB_REF_NAME#v}"
          jq -e 'all(.platforms[].url; contains("/releases/download/"))' \
            release-assets/latest.rewritten.json > /dev/null
          mv release-assets/latest.rewritten.json release-assets/latest.json
          gh release upload "$GITHUB_REF_NAME" release-assets/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  mirror-desktop-update:
    name: Mirror release to YuanHeng platform
    needs: finalize-updater-manifest
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DESKTOP_UPDATE_PUBLISH_URL: ${{ secrets.DESKTOP_UPDATE_PUBLISH_URL }}
      DESKTOP_UPDATE_PUBLISH_TOKEN: ${{ secrets.DESKTOP_UPDATE_PUBLISH_TOKEN }}
    steps:
      - name: Mirror signed updater assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DESKTOP_UPDATE_PUBLISH_URL" || -z "$DESKTOP_UPDATE_PUBLISH_TOKEN" ]]; then
            echo "Desktop update mirror secrets are not configured; keeping GitHub-only updates."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          test -s release-assets/latest.json

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            encoded_filename="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$filename")"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 1800 \
              --request PUT \
              --header "Authorization: Bearer $DESKTOP_UPDATE_PUBLISH_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "${DESKTOP_UPDATE_PUBLISH_URL%/}/${VERSION}/${encoded_filename}"
          done < <(find release-assets -maxdepth 1 -type f ! -name latest.json -print0)

          # The manifest is published last so clients never observe a partial release.
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --request PUT \
            --header "Authorization: Bearer $DESKTOP_UPDATE_PUBLISH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @release-assets/latest.json \
            "${DESKTOP_UPDATE_PUBLISH_URL%/}/latest.json"
